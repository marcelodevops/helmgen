{{- range $name, $svc := .Values.services }}
{{- if not $svc.storage }}
{{- $labels := dict "root" $ "name" $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "helmgen.labels" $labels | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "helmgen.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helmgen.labels" $labels | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | quote }}
          {{- if $svc.command }}
          command:
            {{- range $svc.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $svc.args }}
          args:
            {{- range $svc.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if or $svc.env $svc.secrets }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-{{ $name }}-secret
                  key: {{ $k }}
            {{- end }}
          {{- end }}
          {{- if $svc.ports }}
          ports:
            {{- range $svc.ports }}
            - containerPort: {{ .containerPort }}
            {{- end }}
          {{- end }}
          {{- $res := $svc.resources | default $.Values.resources }}
          {{- if $res }}
          resources:
            {{- toYaml $res | nindent 12 }}
          {{- end }}
          {{- if $svc.livenessProbe }}
          livenessProbe:
            {{- toYaml $svc.livenessProbe | nindent 12 }}
          {{- else if $svc.probePath }}
          livenessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: {{ $svc.probePort | default 80 }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
          {{- if $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml $svc.readinessProbe | nindent 12 }}
          {{- else if $svc.probePath }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: {{ $svc.probePort | default 80 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
---
{{- end }}
{{- end }}
