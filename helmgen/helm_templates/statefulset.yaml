{{- range $name, $svc := .Values.services }}
{{- if $svc.storage }}
{{- $labels := dict "root" $ "name" $name }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "helmgen.labels" $labels | nindent 4 }}
spec:
  serviceName: {{ $.Release.Name }}-{{ $name }}
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "helmgen.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helmgen.labels" $labels | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image | quote }}
          {{- if $svc.command }}
          command:
            {{- range $svc.command }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $svc.args }}
          args:
            {{- range $svc.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if or $svc.env $svc.secrets }}
          env:
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-{{ $name }}-secret
                  key: {{ $k }}
            {{- end }}
          {{- end }}
          {{- if $svc.ports }}
          ports:
            {{- range $svc.ports }}
            - containerPort: {{ .containerPort }}
            {{- end }}
          {{- end }}
          {{- $res := $svc.resources | default $.Values.resources }}
          {{- if $res }}
          resources:
            {{- toYaml $res | nindent 12 }}
          {{- end }}
          {{- if $svc.storagePaths }}
          volumeMounts:
            {{- range $svc.storagePaths }}
            - name: data
              mountPath: {{ . | quote }}
            {{- end }}
          {{- end }}
      {{- if $svc.storagePaths }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-{{ $name }}-pvc
      {{- end }}
---
{{- end }}
{{- end }}
