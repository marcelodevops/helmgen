{{- if and (eq $.Values.secretProvider "externalsecret") (not $.Values.reuseStore) }}
apiVersion: external-secrets.io/v1beta1
kind: {{ ternary "ClusterSecretStore" "SecretStore" (eq $.Values.storeScope "cluster") }}
metadata:
  name: {{ $.Release.Name }}-secretstore
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-secretstore
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helmgen.io/generated: "true"
spec:
  provider:
    vault:
      server: {{ $.Values.vault.server | quote }}
      path: {{ $.Values.vault.path | quote }}
      version: {{ $.Values.vault.version | quote }}
      auth:
        tokenSecretRef:
          name: {{ $.Values.vault.auth.tokenSecretRef.name | quote }}
          key: {{ $.Values.vault.auth.tokenSecretRef.key | quote }}
{{- end }}
