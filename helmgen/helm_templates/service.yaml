{{- range $name, $svc := .Values.services }}
{{- if $svc.ports }}
{{- $labels := dict "root" $ "name" $name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "helmgen.labels" $labels | nindent 4 }}
spec:
  selector:
    {{- include "helmgen.selectorLabels" $labels | nindent 4 }}
  ports:
    {{- include "helmgen.servicePorts" (dict "name" $name "ports" $svc.ports) | nindent 4 }}
  type: {{ $svc.serviceType | default "ClusterIP" }}
---
{{- end }}
{{- end }}
