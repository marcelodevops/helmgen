[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helmgen"
version = "0.3.0"
description = "Auto-generate Helm charts from Docker Compose files"
authors = [
  { name = "Marcelo Garcia", email = "marcelo.garcia@linux.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "build>=1.2.2",
]

[project.urls]
homepage = "https://github.com/marcelodevops/helmgen"
repository = "https://github.com/marcelodevops/helmgen"
issues = "https://github.com/marcelodevops/helmgen/issues"

[project.scripts]
helmgen = "helmgen.generator:main"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
